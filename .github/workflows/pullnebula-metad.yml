name: pullnebula-graphd

on:
  push:
    branches:
      - main

jobs:
  pullnebula-graphd:
    runs-on: ubuntu-latest

    steps:
  

    - name: Log in to Alibaba Cloud ACR
      run: echo "${{ secrets.ACR_PASSWORD }}" | docker login ${{ secrets.ACR_REGISTRY }} --username ${{ secrets.ACR_USERNAME }} --password-stdin

    - name: Pull and push images to Alibaba Cloud ACR
      run: |
        # image=vesoft/nebula-metad:v3.8.0
        # image=vesoft/nebula-storaged:v3.8.0
        image=vesoft/nebula-graphd:v3.8.0
        docker pull $image
        #acr_image="${{ secrets.ACR_REGISTRY }}/qujtdocker/nebula-metad:v3.8.0"
        #acr_image="${{ secrets.ACR_REGISTRY }}/qujtdocker/nebula-storaged:v3.8.0"
        acr_image="${{ secrets.ACR_REGISTRY }}/qujtdocker/nebula-graphd:v3.8.0"
        docker tag $image $acr_image
        docker rmi $image
        echo "Pushing image to ACR: $acr_image"
        docker push $acr_image
        docker rmi $acr_image
