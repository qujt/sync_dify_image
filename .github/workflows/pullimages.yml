name: pull-librechat-images

on:
  push:
    branches:
      - main

jobs:
  pull-librechat-images:
    runs-on: ubuntu-latest

    steps:

    - name: Log in to Alibaba Cloud ACR
      run: echo "${{ secrets.ACR_PASSWORD }}" | docker login ${{ secrets.ACR_REGISTRY }} --username ${{ secrets.ACR_USERNAME }} --password-stdin

    - name: Pull and push images to Alibaba Cloud ACR
      run: |
        set -e
        images=(
          "registry.librechat.ai/danny-avila/librechat-dev:latest"
          "registry.librechat.ai/clickhouse/librechat-admin-panel:latest"
          "registry.librechat.ai/danny-avila/librechat-rag-api-dev-lite:latest"
          "mongo:8.0.20"
          "getmeili/meilisearch:v1.35.1"
          "pgvector/pgvector:0.8.0-pg15-trixie"
        )
        for image in "${images[@]}"; do
          name="${image##*/}"
          acr_image="${{ secrets.ACR_REGISTRY }}/qujtdocker/$name"
          echo "Pulling image: $image"
          docker pull "$image"
          docker tag "$image" "$acr_image"
          docker rmi "$image"
          echo "Pushing image to ACR: $acr_image"
          docker push "$acr_image"
          docker rmi "$acr_image"
        done
